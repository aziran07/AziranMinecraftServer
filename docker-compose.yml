version: "3.9"

services:
  minecraft:
    image: itzg/minecraft-server:java25-alpine
    container_name: aziran-minecraft-26-3
    ports:
      - 25565:25565/tcp
    expose:
      - 25565/tcp
      # BlueMap 내장 웹서버. 호스트에 게시하지 않고 webmap-nginx만 Compose 네트워크로
      # 접근한다(docs/BLUEMAP.md).
      - 8100/tcp
    volumes:
      - ./server-data-26.3-neoforge:/data
    environment:
      #default env
      EULA: "true"
      INIT_MEMORY: "4G"
      MAX_MEMORY: "20G"
      VERSION: "26.3"
      TYPE: "NEOFORGE"
      NEOFORGE_VERSION: "26.3.0.8-beta"

      #curseforge env
      # CURSEFORGE_FILES: |
      #   cloth-config
      #   fabric-api
      #   let-me-despawn
      #   packet-fixer
      #   lithium
      #   indium
      #   chunky-pregenerator
      #   clumps
      #   dynmapforge
      #   resourceful-lib
      #   handcrafted
      #   architectury-api
      #   ftb-library-fabric
      #   ftb-ranks-fabric
      #   ftb-essentials
      #   neruina
      #   macaws-bridges
      #   macaws-fences-and-walls
      #   toms-storage-fabric
      #   terralith
      #   structory
      #   structory-towers
      #   nullscape
      #   croptopia
      #   yet-another-discord-chat-link
      # CF_API_KEY: ${CF_API_KEY}
      #server properties
      DIFFICULTY: "hard"
      ALLOW_FLIGHT: "true"
      ANNOUNCE_PLAYER_ACHIEVEMENTS: "true"
      # Chunky 프리젠 캠페인 동안 빈 서버 일시정지를 끈다(Chunky FAQ 권장값 -1).
      # 일시정지되면 무인 시간에 청크 생성이 멈춘다. 캠페인 종료 후 제거한다.
      PAUSE_WHEN_EMPTY_SECONDS: "-1"

      #rcon env
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD}

      #misc
      TZ: "Asia/Seoul"
      # 컨테이너 안 mc-server-runner가 stop 명령 뒤 Java를 강제 종료하기까지의 시간.
      # 기본 60초로는 프리젠된 월드 저장이 끝나지 않아 exit 255로 끊겼다(docs/BLUEMAP.md).
      STOP_DURATION: "600"
    # Docker의 SIGKILL 유예는 STOP_DURATION보다 길어야 러너가 저장을 끝낼 수 있다.
    stop_grace_period: 660s
    restart: always
    networks:
      - aziran-mc-network

  # 접속자가 0명일 때만 Chunky 프리젠을 돌리는 컨트롤러(docs/CHUNK_PREGEN.md).
  # 모든 대상이 끝나면 exit 0으로 멈추고, 오류 종료만 재시작한다.
  chunky-idle-pregen:
    # 컨트롤러는 Python 표준 라이브러리만 쓰므로 공식 Python 이미지로 실행한다.
    # 이 이미지에는 HEALTHCHECK가 없다.
    image: python:3.13-alpine
    container_name: aziran-chunky-idle-pregen
    entrypoint: ["python3", "-u", "/controller/chunky_idle_controller.py"]
    user: "1000:1000"
    volumes:
      - ./scripts/chunky_idle_controller.py:/controller/chunky_idle_controller.py:ro
      - ./server-data-26.3-neoforge/config/chunky:/chunky:ro
      - ./server-data-26.3-neoforge/logs:/server-logs:ro
      - ./chunky-idle-state:/state
    environment:
      RCON_HOST: minecraft
      RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD}
      TZ: "Asia/Seoul"
    depends_on:
      - minecraft
    restart: on-failure
    networks:
      - aziran-mc-network

  # mcmap.aziran.uk의 HTTPS 원본(docs/BLUEMAP.md). Cloudflare 프록시가 이 서버의
  # 443으로 들어오고, 여기서 TLS를 종료해 BlueMap(http://minecraft:8100)으로 넘긴다.
  # 호스트에는 443만 게시한다. 80과 3733은 이 저장소와 무관한 Nginx가 쓴다.
  webmap-nginx:
    image: nginx:1.30-alpine@sha256:985220252f3863977e468f611ef118ebd01421289dd86ee1ae99cb068c3bce2b
    container_name: aziran-webmap-nginx
    ports:
      - 443:443/tcp
    volumes:
      - ./nginx/webmap.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt mcmap.aziran.uk 인증서(fullchain)와 키(Git 제외). 이미지에 넣지 않고 읽기 전용으로 붙인다.
      - ./nginx/cert.pem:/etc/nginx/cert.pem:ro
      - ./nginx/key.pem:/etc/nginx/key.pem:ro
    environment:
      TZ: "Asia/Seoul"
    depends_on:
      - minecraft
    restart: unless-stopped
    networks:
      - aziran-mc-network

  rcon:
    image: itzg/rcon
    container_name: rcon
    expose:
      - 4326/tcp
      - 4327/tcp
    environment:
      RWA_ENV: "true"
      RWA_RCON_HOST: minecraft
      RWA_RCON_PASSWORD: ${RCON_PASSWORD}
      RWA_ADMIN: "true"
      RWA_USERNAME: ${ADMIN_NAME}
      RWA_PASSWORD: ${ADMIN_PASSWORD}
      RWA_WEB_RCON: "false"
      RWA_WEBSOCKET_URL_SSL: ${WSS_URL}
      RWA_WEBSOCKET_URL: ${WS_URL}
    links:
      - minecraft
    networks:
      - aziran-mc-network

  # Minecraft 서버와 RCON만 운영하기 위해 아래 보조 서비스(portainer, cadvisor,
  # prometheus, grafana, nginx) 정의를 주석 처리했습니다. 각 줄 앞의 "# "만
  # 제거하면 원래 정의가 그대로 복원됩니다.
#   portainer:
#     image: portainer/portainer-ce:alpine-sts
#     container_name: portainer
#     expose:
#       - 9443:9443/tcp
#     volumes:
#       - ./portainer-data:/data
#       - /var/run/docker.sock:/var/run/docker.sock
#     restart: unless-stopped
#     networks:
#       - aziran-mc-network

#   cadvisor:
#     image: gcr.io/cadvisor/cadvisor
#     container_name: cadvisor
#     volumes:
#       - /:/rootfs:ro
#       - /var/run:/var/run:ro
#       - /sys:/sys:ro
#       - /var/lib/docker/:/var/lib/docker:ro
#       - /dev/disk/:/dev/disk:ro
#     user: root
#     restart: always
#     networks:
#       - aziran-mc-network

#   prometheus:
#     image: prom/prometheus
#     container_name: prometheus
#     expose:
#       - 9090:9090
#     volumes:
#       - ./prometheus.yml:/etc/prometheus/prometheus.yml
#       - ./prometheus-data:/prometheus
#     command:
#       - "--storage.tsdb.path=/prometheus"
#       - "--config.file=/etc/prometheus/prometheus.yml"
#     user: root
#     restart: always
#     networks:
#       - aziran-mc-network

#   grafana:
#     image: grafana/grafana
#     container_name: grafana
#     expose:
#       - 3000:3000/tcp
#     volumes:
#       - ./grafana-data:/var/lib/grafana
#     user: root
#     networks:
#       - aziran-mc-network

#   nginx:
#     build:
#       context: ./nginx
#     container_name: nginx
#     ports:
#       - 80:80/tcp
#       - 443:443/tcp
#     volumes:
#       - ./nginx/logs:/var/log/nginx
#     environment:
#       - TZ=Asia/Seoul
#     links:
#       - minecraft
#     networks:
#       - aziran-mc-network

networks:
  aziran-mc-network:
    driver: bridge
