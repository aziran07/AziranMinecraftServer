# mcmap.aziran.uk HTTPS 원본(docs/BLUEMAP.md). Cloudflare 프록시가 443으로 연결하면
# Let's Encrypt 인증서(수동 DNS-01 갱신)로 TLS를 종료하고 BlueMap 내장 웹서버로 넘긴다.

# mcmap.aziran.uk가 아닌 SNI(또는 SNI 없음)는 TLS 핸드셰이크에서 거절한다.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mcmap.aziran.uk;

    ssl_certificate /etc/nginx/cert.pem;
    ssl_certificate_key /etc/nginx/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://minecraft:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
